name: Deploy site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: homepage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: content
      - name: Read pinned template
        id: template
        run: node content/scripts/template-ref.mjs >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.template.outputs.repository }}
          ref: ${{ steps.template.outputs.revision }}
          path: template
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: template/pnpm-lock.yaml
      - run: pnpm --dir template install --frozen-lockfile
      - run: pnpm --dir template test
      - name: Build homepage and search
        run: pnpm --dir template site build --content ../content --out ../content/dist
      - name: Verify migration and internal links
        run: node template/scripts/verify.mjs content/dist content
      - uses: actions/upload-artifact@v4
        with:
          name: homepage-preview
          path: content/dist
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: content/dist
      - name: Publish to existing Pages branch
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: content/dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish homepage
        id: deployment
        uses: actions/deploy-pages@v4
