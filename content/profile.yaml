summary: I am a PhD student in Perceptual Graphics at the University of Leeds. My research interests are virtual reality and high-performance graphics, particularly foveated rendering, stereo reprojection, and image inpainting.
academicBackground: I am supervised by Dr. [Rafael Kuffner dos Anjos](https://rafaelkuffner.github.io/), Dr. Markus Billeter, and Prof. Gordon D. Love. Before starting my PhD, I completed an MSc in High-Performance Graphics and Games Engineering at Leeds with Distinction.
background: Before starting my PhD, I completed an MSc in High-Performance Graphics and Games Engineering at the University of Leeds with Distinction. My MSc covered modelling and rendering, animation and simulation, geometry processing, high-performance graphics, and scientific computation. I also have professional experience developing game servers in Shanghai.
casualHeadline: Games, graphics, and handhelds.
casualSummary: I build graphics libraries, engines, games, and small tools. Before starting my PhD, I completed an MSc in High-Performance Graphics and Games Engineering at the University of Leeds. My MSc covered modelling and rendering, animation and simulation, geometry processing, high-performance graphics, and scientific computation. I also have professional experience developing game servers in Shanghai. I collect retro handhelds and enjoy bringing games and software to GameShell, Game Boy, PocketCHIP, and Trimui. Away from code, I enjoy singing — OmniLyrics grew out of wanting a lyric tool that worked the way I wanted. Curiosity and the satisfaction of making something keep me coming back.
research:
  - title: Perceptual rendering
    description: Which visual details matter to the viewer? I am interested in how the perception of colour, depth, and texture can guide foveated rendering.
  - title: Virtual reality
    description: How can stereo reprojection and hole filling reduce rendering work while preserving visual quality in VR? This connects my interests in perception and high-performance graphics.
  - title: Graphics systems
    description: Vulkan, OpenXR, and reusable rendering tools. Building the foundations to turn research ideas into working experiments.
toolkit:
  - label: Programming languages
    items: [C, C++, C#, Java, Python, Lua]
  - label: Build tools
    items: [xmake, CMake, vcpkg]
  - label: Platforms
    items: [Windows, macOS, Linux]
interests:
  - title: Retro handhelds
    description: I port games and emulators to handhelds including GameShell, PocketCHIP, Game Boy, and Trimui devices.
    href: https://lazy-v.itch.io
  - title: Singing
    description: Away from graphics and code, I enjoy singing. OmniLyrics grew out of wanting a lyric tool that worked the way I wanted.
    href: /projects/omnilyrics/
  - title: Engines & tools
    description: Engines, libraries, fantasy consoles, and useful little tools. I like the process of understanding a thing by making it.
    href: https://github.com/zzxzzk115
