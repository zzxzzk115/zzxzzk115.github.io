upNext:
  - title: Advanced real-time rendering studies
    description: Build small rendering demos on libvultra, exploring GPU-driven large-scene rendering and sampling techniques relevant to my research.
    itemsTitle: Planned work items
    items:
      - title: GPU-driven culling & indirect rendering
        description: Frustum culling, hierarchical Z-buffer (Hi-Z) occlusion culling, stream compaction, and indirect drawing, with visibility and timing comparisons.
      - title: Cluster-based LOD & geometry streaming
        description: Mesh clustering, hierarchical LOD selection, and on-demand geometry streaming, taking inspiration from Nanite.
      - title: Virtual texturing
        description: Feedback-driven texture streaming, page tables, and cache management under a fixed memory budget.
      - title: Tiled & clustered shading
        description: Compare tiled and clustered light assignment in forward and deferred shading, including light-list construction and shading cost.
      - title: Dynamic global illumination
        description: Explore voxel-based global illumination (VXGI), Dynamic Diffuse Global Illumination (DDGI), and Lumen-inspired surface-cache and radiance-cache experiments.
      - title: ReSTIR DI & GI
        description: Implement ReSTIR DI for many-light direct illumination using spatiotemporal reservoir resampling, then investigate ReSTIR GI for indirect illumination and VR applications.
    modes: [academic, casual]
